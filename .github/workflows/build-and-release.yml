name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. v1.0.1)'
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build index.js from code.js
        run: bun build code.js --outfile ./index.js --target node --minify

      - name: Commit built index.js
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.js
          git diff --staged --quiet || git commit -m "chore: build index.js for ${{ github.event.inputs.version }} [skip ci]"
          git push

      - name: Create tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: "Manual release for version ${{ github.event.inputs.version }}"
          make_latest: true
          files: |
            index.js
